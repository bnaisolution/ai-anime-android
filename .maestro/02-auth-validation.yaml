appId: org.dpdns.bnai.anime
---
- launchApp:
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
    waitUntilVisible: true
- extendedWaitUntil:
    visible: "AI Cinematic Anime Studio"
    timeout: 60000
- tapOn: "Sign In to Studio"
- extendedWaitUntil:
    visible: "Email and password are required."
    timeout: 30000
