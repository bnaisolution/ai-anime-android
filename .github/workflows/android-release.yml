name: Build Signed Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version name"
        required: true
        default: "1.0.0"
      version_code:
        description: "Monotonic version code"
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  release:
    name: Signed release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require signing secrets
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || { echo "ANDROID_KEYSTORE_BASE64 is not configured"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is not configured"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is not configured"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is not configured"; exit 1; }
      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$ANDROID_KEYSTORE_PATH"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build release APK and bundle
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -PversionName="${{ inputs.version_name }}" \
            -PversionCode="${{ inputs.version_code }}" \
            --no-daemon --stacktrace
      - name: Verify and checksum
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK" && test -s "$AAB"
          sha256sum "$APK" "$AAB" | tee release.sha256
          {
            echo "### Signed release"
            echo "- APK: \`$APK\`"
            echo "- AAB: \`$AAB\`"
            echo "- SHA-256:"
            cat release.sha256
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anime-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            release.sha256
          retention-days: 30
          if-no-files-found: error
      - name: Remove keystore
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
